name: Build Auno Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble full APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-ndk

      - name: Install Android SDK and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$NDK"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: apk-full

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Generate release signing material
        run: |
          keytool -genkeypair -v \
            -keystore android/auno-release.jks \
            -alias auno \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass auno-release -keypass auno-release \
            -dname "CN=Auno Player, OU=Auno, O=Auno, L=NA, S=NA, C=US"
          cat > android/key.properties <<'EOF'
          storeFile=auno-release.jks
          storePassword=auno-release
          keyAlias=auno
          keyPassword=auno-release
          EOF

      - name: Build release APK (full flavor)
        run: |
          # Cargokit sets CC/AR for cross builds but does not pass bindgen the
          # Android sysroot. Without these, bindgen cannot find sys/types.h or
          # bits/libc-header-start.h when generating the wavpack/opus bindings.
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/arm-linux-androideabi"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/x86_64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/i686-linux-android"
          flutter build apk --release --flavor full

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/apk/full/release/app-full-release.apk
          test -s build/app/outputs/apk/full/release/app-full-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auno-player-full-release
          path: build/app/outputs/apk/full/release/app-full-release.apk
          if-no-files-found: error
